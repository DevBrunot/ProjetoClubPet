version: '3.8'

services:
  mariadb:
    image: mariadb:latest
    container_name: clubpet_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: clubpet_db
      MYSQL_USER: clubpet_user
      MYSQL_PASSWORD: clubpet_password
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - clubpet_network
    command: 
      - '--character-set-server=utf8mb4'
      - '--collation-server=utf8mb4_unicode_ci'
      - '--default-authentication-plugin=mysql_native_password'
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  clubpet_network:
    driver: bridge

volumes:
  mariadb_data:
    driver: local 